services:
  - type: web
    name: blogsphere-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn 'run:app' --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: blogsphere
      - key: JWT_SECRET
        generateValue: true
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "604800"
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
